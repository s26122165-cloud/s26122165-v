<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>氏兒 潘 ✦ 網頁程式冒險地圖</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Zen Maru Gothic & Fredoka -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Zen Maru Gothic', 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #FFE5EC 0%, #F0E6FF 50%, #E8F5E9 100%);
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        /* Dreamy Soft Glassmorphism */
        .cute-card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 2.5px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 12px 32px rgba(255, 182, 193, 0.25);
        }

        /* Floating background canvas */
        .sparkle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Floating animation for avatar header */
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(0.8deg); }
        }

        .animate-float {
            animation: gentleFloat 4.5s ease-in-out infinite;
        }

        /* Card Hover Animations */
        .level-card {
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .level-card.unlocked:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 18px 36px rgba(255, 154, 162, 0.4);
        }

        /* Click Sparkle & Heart Effect Animation */
        .click-pop {
            position: absolute;
            pointer-events: none;
            font-size: 1.5rem;
            animation: popAndFade 0.7s ease-out forwards;
            z-index: 100;
        }

        @keyframes popAndFade {
            0% { transform: scale(0.3) translateY(0) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.4) translateY(-20px) rotate(20deg); opacity: 0.9; }
            100% { transform: scale(1.8) translateY(-40px) rotate(40deg); opacity: 0; }
        }

        /* Custom Soft Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #FFE5EC;
        }
        ::-webkit-scrollbar-thumb {
            background: #FFB6C1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="text-slate-700 relative pb-16">

    <!-- Interactive Floating Stars & Sparkles Canvas -->
    <canvas id="sparkleBg" class="sparkle-canvas"></canvas>

    <div class="max-w-5xl mx-auto px-4 pt-8 sm:pt-12 relative z-10">

        <!-- Hero Section: Profile & Name -->
        <header class="cute-card rounded-3xl p-6 sm:p-9 mb-10 text-center animate-float relative overflow-hidden">
            <!-- Decorative Cloud Accents -->
            <div class="absolute -top-5 -left-5 text-pink-200 text-7xl opacity-50"><i class="fa-solid fa-cloud"></i></div>
            <div class="absolute -bottom-5 -right-5 text-purple-200 text-8xl opacity-50"><i class="fa-solid fa-cloud"></i></div>
            <div class="absolute top-4 right-8 text-yellow-300 text-2xl animate-pulse"><i class="fa-solid fa-star"></i></div>

            <div class="relative z-10 flex flex-col items-center">
                <!-- Avatar with Rainbow Gradient Glow Border -->
                <div class="relative mb-4 group">
                    <div class="w-28 h-28 sm:w-32 sm:h-32 rounded-full p-1.5 bg-gradient-to-tr from-pink-300 via-purple-300 via-sky-200 to-amber-200 shadow-md">
                        <div class="w-full h-full rounded-full overflow-hidden bg-white flex items-center justify-center shadow-inner">
                            <!-- Cute Bunny Developer Avatar Placeholder SVG -->
                            <svg class="w-24 h-24 text-pink-400" viewBox="0 0 100 100" fill="currentColor">
                                <circle cx="50" cy="55" r="30" fill="#FFE5EC"/>
                                <!-- Bunny Ears -->
                                <ellipse cx="38" cy="20" rx="8" ry="21" fill="#FFC6FF"/>
                                <ellipse cx="38" cy="20" rx="4" ry="14" fill="#FFF0F5"/>
                                <ellipse cx="62" cy="20" rx="8" ry="21" fill="#FFC6FF"/>
                                <ellipse cx="62" cy="20" rx="4" ry="14" fill="#FFF0F5"/>
                                <!-- Face Details -->
                                <circle cx="41" cy="52" r="3.2" fill="#5C4D61"/>
                                <circle cx="59" cy="52" r="3.2" fill="#5C4D61"/>
                                <path d="M 47 58 Q 50 61 53 58" stroke="#5C4D61" stroke-width="2.2" fill="none" stroke-linecap="round"/>
                                <ellipse cx="34" cy="57" rx="4.5" ry="3" fill="#FF9AA2" opacity="0.6"/>
                                <ellipse cx="66" cy="57" rx="4.5" ry="3" fill="#FF9AA2" opacity="0.6"/>
                            </svg>
                        </div>
                    </div>
                    <!-- Level Badge -->
                    <span class="absolute bottom-1 right-0 bg-amber-300 text-amber-900 text-xs px-2.5 py-1 rounded-full font-black shadow-md border-2 border-white flex items-center gap-1">
                        ✨ LV.2
                    </span>
                </div>

                <!-- Main Name and Subtitle -->
                <h1 class="text-3xl sm:text-4xl font-black text-slate-800 tracking-wide mb-1 flex items-center justify-center gap-2">
                    <span>氏兒 潘</span>
                    <span class="text-pink-400 text-2xl">🌸</span>
                </h1>
                <p class="text-pink-500 font-bold text-sm sm:text-base mb-4 tracking-wider">
                    ✦ 氏兒 潘 的網頁程式冒險地圖 ✦
                </p>

                <!-- Status Badges -->
                <div class="flex flex-wrap justify-center gap-2 sm:gap-3">
                    <span class="bg-pink-100 text-pink-700 border border-pink-200 text-xs font-bold px-3.5 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-wand-magic-sparkles text-pink-400"></i> 前端程式設計冒險中
                    </span>
                    <span class="bg-purple-100 text-purple-700 border border-purple-200 text-xs font-bold px-3.5 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-gamepad text-purple-400"></i> 通關進度：2 / 16
                    </span>
                </div>
            </div>
        </header>

        <!-- Level Progress Grid Section -->
        <main>
            <div class="flex items-center justify-between mb-6 px-2">
                <h2 class="text-lg sm:text-xl font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-map text-pink-400"></i>
                    冒險關卡挑戰 (Quest Levels)
                </h2>
                <span class="text-xs text-slate-600 font-bold bg-white/70 px-3 py-1 rounded-full border border-pink-100 shadow-sm">
                    點擊解鎖關卡開啟網頁 🐾
                </span>
            </div>

            <!-- Responsive Grid (1 col mobile, 2 col tablet, 4 col desktop) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5" id="levelGrid">
                
                <!-- Level 1 (Unlocked) -->
                <a href="w1/index.html" class="level-card unlocked cute-card rounded-2xl p-4.5 flex flex-col justify-between border-2 border-pink-200/90 hover:border-pink-300 group relative overflow-hidden">
                    <div class="flex justify-between items-start mb-3">
                        <span class="bg-pink-400 text-white font-black text-xs px-2.5 py-1 rounded-xl shadow-sm">
                            LEVEL 01
                        </span>
                        <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200 flex items-center gap-1">
                            <i class="fa-solid fa-lock-open text-[10px]"></i> 已解鎖 ✦
                        </span>
                    </div>
                    <div class="my-2">
                        <h3 class="font-bold text-slate-800 text-base group-hover:text-pink-500 transition-colors flex items-center gap-2">
                            <span>Week 1 - 數位名片</span>
                        </h3>
                        <p class="text-xs text-slate-500 mt-1">個人品牌與個人簡介網頁展示</p>
                    </div>
                    <div class="mt-3 pt-3 border-t border-pink-100 flex justify-between items-center text-xs font-bold text-pink-500">
                        <span>開啟關卡</span>
                        <i class="fa-solid fa-circle-arrow-right text-sm group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </a>

                <!-- Level 2 (Unlocked) -->
                <a href="w2/index.html" class="level-card unlocked cute-card rounded-2xl p-4.5 flex flex-col justify-between border-2 border-purple-200/90 hover:border-purple-300 group relative overflow-hidden">
                    <div class="flex justify-between items-start mb-3">
                        <span class="bg-purple-400 text-white font-black text-xs px-2.5 py-1 rounded-xl shadow-sm">
                            LEVEL 02
                        </span>
                        <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200 flex items-center gap-1">
                            <i class="fa-solid fa-lock-open text-[10px]"></i> 已解鎖 ✦
                        </span>
                    </div>
                    <div class="my-2">
                        <h3 class="font-bold text-slate-800 text-base group-hover:text-purple-500 transition-colors flex items-center gap-2">
                            <span>Week 2 - 今天吃甚麼?</span>
                        </h3>
                        <p class="text-xs text-slate-500 mt-1">互動式美食隨機選擇器與轉盤</p>
                    </div>
                    <div class="mt-3 pt-3 border-t border-purple-100 flex justify-between items-center text-xs font-bold text-purple-500">
                        <span>開啟關卡</span>
                        <i class="fa-solid fa-circle-arrow-right text-sm group-hover:translate-x-1 transition-transform"></i>
                    </div>
                </a>

                <!-- Levels 3 to 16 generated dynamically via JavaScript below -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="mt-14 text-center text-xs text-slate-400 font-bold">
            <p>© 2026 氏兒 潘 (Shi-Er Pan) ✦ 網頁程式設計作品集 ✨ All Rights Reserved.</p>
        </footer>
    </div>

    <script>
        // Dynamically create locked levels 3 to 16
        const levelGrid = document.getElementById('levelGrid');
        
        for (let i = 3; i <= 16; i++) {
            const levelCard = document.createElement('div');
            levelCard.className = "level-card cute-card rounded-2xl p-4.5 flex flex-col justify-between opacity-60 bg-slate-50/60 cursor-not-allowed select-none border-2 border-slate-200/60";
            
            levelCard.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <span class="bg-slate-300 text-slate-600 font-black text-xs px-2.5 py-1 rounded-xl">
                        LEVEL ${i < 10 ? '0' + i : i}
                    </span>
                    <span class="text-xs font-bold text-slate-400 bg-slate-100 px-2.5 py-0.5 rounded-full flex items-center gap-1 border border-slate-200">
                        🔒 尚未解鎖
                    </span>
                </div>
                <div class="my-2">
                    <h3 class="font-bold text-slate-400 text-base flex items-center gap-1.5">
                        Week ${i} - 尚待探索
                    </h3>
                    <p class="text-xs text-slate-400 mt-1">冒險關卡準備中，敬請期待...</p>
                </div>
                <div class="mt-3 pt-3 border-t border-slate-200/60 flex justify-between items-center text-xs font-bold text-slate-300">
                    <span>未解鎖 🔒</span>
                    <i class="fa-solid fa-lock text-slate-300"></i>
                </div>
            `;
            
            levelGrid.appendChild(levelCard);
        }

        // Animated Dreamy Background Stars Canvas
        const canvas = document.getElementById('sparkleBg');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const sparkles = [];
        const pastelColors = ['#FFB6C1', '#FFD1DC', '#E6E6FA', '#B0E0E6', '#FFFACD', '#D8BFD8'];

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 3.5 + 1;
                this.color = pastelColors[Math.floor(Math.random() * pastelColors.length)];
                this.alpha = Math.random();
                this.speed = Math.random() * 0.015 + 0.005;
            }

            update() {
                this.alpha += this.speed;
                if (this.alpha > 1 || this.alpha < 0) {
                    this.speed = -this.speed;
                }
                if (this.alpha < 0) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.abs(this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Initialize particles
        for (let i = 0; i < 50; i++) {
            sparkles.push(new Particle());
        }

        function animateBg() {
            ctx.clearRect(0, 0, width, height);
            sparkles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateBg);
        }

        window.onload = function() {
            animateBg();
        };

        // Click Pop Sparkle & Heart Effect
        const cuteEmojis = ['✨', '💖', '🌸', '🐾', '⭐', '🍬'];
        document.addEventListener('click', (e) => {
            const pop = document.createElement('div');
            pop.className = 'click-pop';
            pop.innerText = cuteEmojis[Math.floor(Math.random() * cuteEmojis.length)];
            pop.style.left = `${e.clientX - 12}px`;
            pop.style.top = `${e.clientY - 12}px`;
            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 700);
        });
    </script>
</body>
</html>
